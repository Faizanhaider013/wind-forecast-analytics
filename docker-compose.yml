# Development Compose: FastAPI backend + Vite dev server (hot reload).
# For a production-style build (Nginx-served static frontend), use
# docker-compose.prod.yml instead.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Ingestion writes the SQLite DB and raw JSON cache here.
      - WIND_DATA_DIR=/app/data
    volumes:
      # Persist ingested data on the host and make it visible outside Docker.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # In dev the browser talks to the backend directly on its published port.
      # (The app otherwise uses relative URLs via the Vite dev proxy.)
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
