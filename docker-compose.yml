# Minimal Compose setup for local development of the scaffold.
# Runs the FastAPI backend and the Vite dev server side by side.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Ingestion writes the SQLite DB and raw JSON cache here.
      - WIND_DATA_DIR=/app/data
    volumes:
      # Persist ingested data on the host and make it visible outside Docker.
      - ./data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Browser talks to the backend on the host-published port.
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
