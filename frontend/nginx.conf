# Nginx config for the production frontend image.
#
# Serves the built SPA and proxies API traffic to the FastAPI backend, so the
# browser only ever talks to this one origin:
#   - /api/...  and /health  -> backend service (same-origin, no CORS needed)
#   - everything else         -> static files, with React Router history fallback
#
# `backend` resolves to the Compose service of that name on the shared network;
# the frontend waits for it via depends_on: condition: service_healthy.

upstream api_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight liveness endpoint for this container's own healthcheck
    # (answered by Nginx, not proxied to the backend).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend API. proxy_pass without a URI path preserves the full /api/... URI.
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health check (exact match so it is not shadowed by the SPA route).
    location = /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve the file if it exists, otherwise fall back to index.html so
    # client-side routes (e.g. /decision, /accuracy) load on refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; never cache the HTML entry point.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
